<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUNO CORE ENGINE</title><style>body{font-family:system-ui;background:#071512;color:#d7ffe9;max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1b513e;padding-bottom:14px}h1{color:#29f29a}section{background:#0b211b;border:1px solid #1c5943;border-radius:12px;padding:16px;margin:16px 0}code{color:#7dffbc}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #163b2e;text-align:left;font-size:13px}.ok{color:#35f59e}.warn{color:#ffc861}.bad{color:#ff7777}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#0e2a21;padding:12px;border-radius:8px}</style></head><body><header><div><h1>JUNO CORE ENGINE</h1><small>TESTNET-ONLY · GERÇEK VERİ · NO MOCK</small></div><div id="clock"></div></header><section><div class="grid"><div class="card">Çalışma: <strong id="running">—</strong></div><div class="card">Binance Testnet: <strong id="testnet">—</strong></div><div class="card">Emir katmanı: <strong id="orders">—</strong></div><div class="card">Son güncelleme: <strong id="updated">—</strong></div></div></section><section><h2>AI / Trading Kararları</h2><table><thead><tr><th>Coin</th><th>Karar</th><th>Gerekçe</th><th>Zaman</th></tr></thead><tbody id="signals"><tr><td colspan="4">Gerçek sağlayıcılardan veri bekleniyor.</td></tr></tbody></table></section><section><h2>Balina Alarmları</h2><table><thead><tr><th>Coin</th><th>Olay</th><th>Payload</th><th>Zaman</th></tr></thead><tbody id="whales"><tr><td colspan="4">Gerçek Alchemy verisi bekleniyor.</td></tr></tbody></table></section><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function refresh(){const r=await fetch('/api/status');const d=await r.json();document.querySelector('#running').textContent=d.health.running?'AKTİF':'DURDU';document.querySelector('#testnet').textContent=d.health.testnet?'EVET':'HATA';document.querySelector('#orders').textContent=d.health.order_execution_ready?'HAZIR':'KAPALI';document.querySelector('#updated').textContent=new Date().toLocaleTimeString('tr-TR');document.querySelector('#signals').innerHTML=d.signals.length?d.signals.map(x=>`<tr><td>${esc(x.coin)}</td><td>${esc(x.decision)}</td><td>${esc(x.reason)}</td><td>${esc(x.created_at)}</td></tr>`).join(''):'<tr><td colspan="4">Gerçek sağlayıcılardan veri bekleniyor.</td></tr>';document.querySelector('#whales').innerHTML=d.whales.length?d.whales.map(x=>`<tr><td>${esc(x.coin)}</td><td>${esc(x.event_type)}</td><td><code>${esc(x.payload)}</code></td><td>${esc(x.created_at)}</td></tr>`).join(''):'<tr><td colspan="4">Gerçek Alchemy verisi bekleniyor.</td></tr>'}setInterval(()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString('tr-TR'),1000);refresh();setInterval(refresh,10000)</script></body></html>
